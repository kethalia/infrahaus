# tmux configuration for forge-shield environment
# Prefix: Ctrl-a (more ergonomic than default Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Base index: windows and panes start at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# 256 color support
set -g default-terminal "screen-256color"

# Increase scrollback buffer
set -g history-limit 10000

# Faster key repetition (no escape time delay)
set -sg escape-time 0

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config shortcut: prefix + r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Window navigation
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Status bar
set -g status-bg colour235
set -g status-fg colour136
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[fg=colour166][#S] "
set -g status-right "#[fg=colour136]#H  #[fg=colour166]%Y-%m-%d %H:%M"

# Window status
setw -g window-status-format "#[fg=colour244]#I:#W"
setw -g window-status-current-format "#[fg=colour166,bold]#I:#W"

# Pane borders
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour166
